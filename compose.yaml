services:
  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      POSTGRES_DB: campus
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["campus-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  campus-db:
