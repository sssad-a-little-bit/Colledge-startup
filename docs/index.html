<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="КИТ Campus — учебный портал: расписание, оценки, группы и кружки в одном личном кабинете."
    />
    <meta
      http-equiv="refresh"
      content="0; url=https://colledge-startup.vercel.app"
    />
    <link rel="canonical" href="https://colledge-startup.vercel.app" />
    <title>КИТ Campus · Переход в учебный портал</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #27213a;
        background: #f6f5fa;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 540px);
        padding: clamp(28px, 6vw, 48px);
        border: 1px solid #e5dfef;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 18px 60px #3c2c6510;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 36px;
        font-size: 21px;
        font-weight: 700;
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #6554c6;
        color: #fff;
      }
      .brand-light { color: #7b718d; font-weight: 400; }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(28px, 6vw, 36px);
        line-height: 1.2;
        letter-spacing: -0.035em;
      }
      p { color: #70677f; line-height: 1.7; }
      .button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 48px;
        padding: 12px 24px;
        margin-top: 12px;
        border-radius: 11px;
        background: #6554c6;
        color: #fff;
        font-weight: 650;
        text-decoration: none;
      }
      .button:hover { background: #5140ae; }
      .button:focus-visible {
        outline: 3px solid #b5a6ee;
        outline-offset: 4px;
      }
      .address {
        margin: 20px 0 0;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      @media (max-width: 420px) {
        body { padding: 16px; }
        .button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">К</span>
        <span>КИТ <span class="brand-light">Campus</span></span>
      </div>
      <h1>Открываем учебный портал</h1>
      <p>
        Расписание, оценки, группы и кружки доступны по постоянному адресу.
        Если переход не начался автоматически, нажмите кнопку ниже.
      </p>
      <a class="button" href="https://colledge-startup.vercel.app">
        Открыть портал <span aria-hidden="true">&nbsp;→</span>
      </a>
      <p class="address">colledge-startup.vercel.app</p>
    </main>
  </body>
</html>
