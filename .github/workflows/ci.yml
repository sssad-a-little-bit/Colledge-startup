name: campus-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: ci_local_database_only
          POSTGRES_DB: campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d campus_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://campus:ci_local_database_only@localhost:5432/campus_test?connection_limit=8&pool_timeout=10&connect_timeout=5
      TEST_DATABASE_URL: postgresql://campus:ci_local_database_only@localhost:5432/campus_test?connection_limit=8&pool_timeout=10&connect_timeout=5
      NEXTAUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: npm
      - name: Ephemeral test credentials
        run: |
          node -e "const fs=require('fs'),c=require('crypto');fs.appendFileSync(process.env.GITHUB_ENV,'NEXTAUTH_SECRET='+c.randomBytes(32).toString('hex')+'\nDEMO_PASSWORD='+c.randomBytes(24).toString('base64url')+'\n')"
      - run: npm ci
      - run: npm run db:migrate
      - run: DEMO_SEED=1 npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run tests/csv.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real PostgreSQL integration and browser checks
        run: |
          npm start > /tmp/campus-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health/ready > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run test:integration
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
